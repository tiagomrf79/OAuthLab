<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Public Client</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="container">
      <header class="app-header">
        <h1>OAuth2 Public Client</h1>
        <p>A browser-only playground for the grant types a client without a secret can use</p>
      </header>

      <section class="oauth-panel">
        <h2>Flows</h2>
        <div class="oauth-actions-grid">
          <!-- Each flow is its own page with its own redirect URI, registered on the AS's public-client. -->
          <a href="/implicit/" class="oauth-action-btn">
            <span class="oauth-action-title">Implicit</span>
            <span class="oauth-action-desc">The access token comes straight back in the redirect URI fragment</span>
          </a>
          <a href="/code-pkce/" class="oauth-action-btn">
            <span class="oauth-action-title">Authorization Code + PKCE</span>
            <span class="oauth-action-desc">A code comes back, and is exchanged for tokens with a code verifier instead of a secret</span>
          </a>
        </div>
      </section>
    </div>
  </body>
</html>
